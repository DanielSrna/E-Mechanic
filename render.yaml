services:
  - type: web
    name: emechanic-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: BCRYPT_SALT_ROUNDS
        value: '10'
      - key: JWT_SECRET_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_SECRET_EXPIRES_IN
        value: 7d
      - key: PORT
        value: '3000'
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
        required: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
        required: false
